<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contato - INFRA TECH</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="pagina-contato">

  <main>
    <section class="secao-contato">
    <h2>Entre em Contato</h2>
    <p class="subtitulo-form">Preencha os dados abaixo para falar com nossa equipe.</p>

    <form id="formContato" class="form-contato">
      <div class="campo-grupo">
        <label for="nome">Nome Completo:</label>
        <input
          type="text"
          id="nome"
          name="nome"
          placeholder="Digite seu nome"
          pattern="[A-Za-zÀ-ÖØ-öø-ÿ\s]+"
          title="Digite apenas letras e espaços"
          autocomplete="name"
          required
        >
      </div>

      <div class="campo-duplo">
        <div class="campo-grupo">
          <label for="email">E-mail:</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="seu-email@exemplo.com"
            autocomplete="email"
            required
          >
        </div>

        <div class="campo-grupo">
          <label for="telefone">Telefone / WhatsApp:</label>
          <input
            type="tel"
            id="telefone"
            name="telefone"
            placeholder="(11) 99999-9999"
            maxlength="15"
            autocomplete="tel"
            required
          >
        </div>
      </div>

      <div class="campo-duplo">
        <div class="campo-grupo">
          <label for="cep">CEP:</label>
          <input
            type="text"
            id="cep"
            name="cep"
            placeholder="00000-000"
            maxlength="9"
            inputmode="numeric"
            autocomplete="postal-code"
          >
        </div>

        <div class="campo-grupo">
          <label for="cidade">Cidade / UF:</label>
          <input
            type="text"
            id="cidade"
          name="cidade"
            name="cidade"
            placeholder="Preenchido automaticamente"
            readonly
          >
        </div>
      </div>

      <div class="campo-triplo">
        <div class="campo-grupo">
          <label for="rua">Rua / Logradouro:</label>
          <input
            type="text"
            id="rua"
            name="rua"
            placeholder="Preenchido automaticamente"
            autocomplete="street-address"
          >
        </div>

        <div class="campo-grupo">
          <label for="numero">Número:</label>
          <input
            type="text"
            id="numero"
            name="numero"
            placeholder="Ex: 120"
            required
          >
        </div>

        <div class="campo-grupo">
          <label for="bairro">Bairro:</label>
          <input
            type="text"
            id="bairro"
            name="bairro"
            placeholder="Preenchido automaticamente"
          >
        </div>
      </div>

      <div class="campo-grupo">
        <label for="assunto">Assunto:</label>
        <select id="assunto" name="assunto" required>
          <option value="" disabled selected>Selecione um assunto</option>
          <option value="orcamento">Solicitar Orçamento</option>
          <option value="suporte">Suporte Técnico</option>
          <option value="duvidas">Dúvidas Gerais</option>
          <option value="parceria">Parcerias</option>
        </select>
      </div>

      <div class="campo-grupo">
        <label for="mensagem">Mensagem:</label>
        <textarea
          id="mensagem"
          name="mensagem"
          rows="5"
          placeholder="Escreva sua mensagem aqui..."
          required
        ></textarea>
      </div>

      <button type="submit" id="btnEnviar" class="btn-enviar">Enviar Mensagem</button>

      <div id="statusEnvio" class="status-envio" role="status" aria-live="polite"></div>
    </form>
    </section>
  </main>

  <script src="js/script1.js"></script>
</body>
</html>

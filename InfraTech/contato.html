        <section class="secao">
      <h2>Entre em Contato</h2>
      <form action="#" method="POST" class="form-contato">
        <div class="campo-grupo">
          <label for="nome">Nome Completo:</label>
          <input type="text" id="nome" name="nome" placeholder="Digite seu nome" pattern="[A-Za-zÀ-ÖØ-öø-ÿ\s]+" title="Digite apenas letras e espaços" autocomplete="name" required>
        </div>
        <div class="campo-grupo">
          <label for="email">E-mail:</label>
          <input type="email" id="email" name="email" placeholder="seu-email@exemplo.com" required>
        </div>
        <div class="campo-grupo">
          <label for="telefone">Telefone / WhatsApp:</label>
          <input type="number" id="telefone" name="telefone" placeholder="(11) 99999-9999">
        </div>
        <div class="campo-grupo">
          <label for="assunto">Assunto:</label>
          <select id="assunto" name="assunto" required>
            <option value="" disabled selected>Selecione um assunto</option>
            <option value="orcamento">Solicitar Orçamento</option>
            <option value="suporte">Suporte Técnico</option>
            <option value="duvidas">Dúvidas Gerais</option>
            <option value="parceria">Parcerias</option>
          </select>
        </div>
        <div class="campo-grupo">
          <label for="mensagem">Mensagem:</label>
          <textarea id="mensagem" name="mensagem" rows="6" placeholder="Escreva sua mensagem aqui..." required></textarea>
        </div>
        <button type="submit" class="btn-enviar">Enviar Mensagem</button>
      </form>
    </section>

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - INFRA TECH</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="js/script1.js" defer></script>
</head>

<body>

    <div class="nav-flutuante-wrapper">
        <nav class="nav-flutuante">

            <div class="nav-esquerda">

                <a href="home.html" class="nav-logo-box">
                    <img src="img/logo.jpeg" alt="Logo INFRA TECH">
                </a>

                <ul class="nav-links-modelo">
                    <li><a href="home.html">Home</a></li>
                    <li><a href="empresa.html">Empresa</a></li>
                    <li><a href="servicos.html">Serviços</a></li>
                    <li><a href="contato.html">Contato</a></li>
                </ul>

            </div>
            <!-- botão área do cliente -->
            <div class="nav-direita">

                <div class="dropdown-cliente">

                    <button class="btn-area-cliente">
                        Área do Cliente ▼
                    </button>

                    <div class="menu-cliente">
                        <a href="login.html">Login</a>
                        <a href="cadastro.html">Cadastro</a>
                    </div>

                </div>

                <a href="contato.html" class="btn-pill-primario">
                    Fale Conosco
                </a>

            </div>

        </nav>
    </div>
    <!-- formulário -->
    <main>

        <div class="formulario">

            <h2 id="tituloFormulario">Login</h2>

            <div id="areaLogin">
                <form id="formLogin">

                    <label for="emailLogin">Email:</label>
                    <input type="email" id="emailLogin" required>

                    <label for="senhaLogin">Senha:</label>
                    <input type="password" id="senhaLogin" required>
                    <label class="opcao-senha">
                        <input type="checkbox" class="alternar-senha" data-campos="senhaLogin">
                        Mostrar senha
                    </label>

                    <button type="submit">Entrar</button>

                </form>

                <button type="button" class="botao-recuperar-senha" id="botaoEsqueciSenha">
                    Esqueci a senha
                </button>

                <p id="mensagemLogin"></p>
            </div>

            <form id="formRecuperacaoSenha" hidden>
                <label for="emailRecuperacao">Email cadastrado:</label>
                <input type="email" id="emailRecuperacao" required>

                <label for="novaSenha">Nova senha:</label>
                <input type="password" id="novaSenha" required>

                <label for="confirmarNovaSenha">Confirme a nova senha:</label>
                <input type="password" id="confirmarNovaSenha" required>
                <label class="opcao-senha">
                    <input type="checkbox" class="alternar-senha" data-campos="novaSenha confirmarNovaSenha">
                    Mostrar senhas
                </label>

                <button type="submit">Atualizar senha</button>
                <button type="button" class="botao-secundario" id="botaoVoltarLogin">
                    Voltar ao login
                </button>

                <p id="mensagemRecuperacao" aria-live="polite"></p>
            </form>
        </div>

    </main>

    <footer>
        <div class="footer-conteudo">
            <p>&copy; 2026 INFRA TECH. Todos os direitos reservados.</p>
        </div>
    </footer>

</body>

</html>

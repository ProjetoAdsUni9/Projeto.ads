    <div class="nav-flutuante-wrapper">
        <nav class="nav-flutuante">

            <div class="nav-esquerda">

                <a href="home.html" class="nav-logo-box">
                    <img src="img/logo.jpeg" alt="Logo INFRA TECH">
                </a>

                <ul class="nav-links-modelo">
                    <li><a href="home.html">Home</a></li>
                    <li><a href="empresa.html">Empresa</a></li>
                    <li><a href="servicos.html">Serviços</a></li>
                    <li><a href="contato.html">Contato</a></li>
                </ul>

            </div>

            <div class="nav-direita">

             <!-- botão área do cliente -->

                    </button>

                        <a href="login.html">Login</a>

                </a>

            </div>

        </nav>
    </div>

    <main>
<!-- formulário -->
        <div class="formulario">

            <h2>Cadastro de Cliente</h2>

            <form id="formCadastro">

                <label>Nome:</label>
                <input type="text" id="nome" required>

                <label>Email:</label>
                <input type="email" id="email" required>

                <label>Senha:</label>
                <input type="password" id="senha" required>

                <label>Confirmar Senha:</label>
                <input type="password" id="confirmarSenha" required>
                <label class="opcao-senha">
                    <input type="checkbox" class="alternar-senha" data-campos="senha confirmarSenha">
                    Mostrar senhas
                </label>

                <button type="submit">
                    Cadastrar
                </button>

            </form>

            <p id="mensagem"></p>

        </div>

    </main>

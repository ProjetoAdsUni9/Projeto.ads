<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X | S - Contato</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>
<body>
  <button id="botaoMenu" type="button">☰ Menu</button>
  <nav id="lateral">
    <div id="menu">
      <a href="index.html">Home</a>
      <a href="empresa.html">Empresa</a>
      <a href="servicos.html">Serviços</a>
      <a href="contato.html">Contato</a>
    </div>
  </nav>
  <header>
    <div class="logo-titulo">
      <img src=img\logo.jpeg>
      <div class="titulos">
        <h1>X | S</h1>
        <h1>Soluções Tech</h1>
      </div>
    </div>
  </header>
  <main>
    <section class="secao">
      <h2>Entre em Contato</h2>
      <form action="#" method="POST" class="form-contato">
        <div class="campo-grupo">
          <label for="nome">Nome Completo:</label>
          <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
        </div>
        <div class="campo-grupo">
          <label for="email">E-mail:</label>
          <input type="email" id="email" name="email" placeholder="seu-email@exemplo.com" required>
        </div>
        <div class="campo-grupo">
          <label for="telefone">Telefone / WhatsApp:</label>
          <input type="tel" id="telefone" name="telefone" placeholder="(11) 99999-9999">
        </div>
        <div class="campo-grupo">
          <label for="assunto">Assunto:</label>
          <select id="assunto" name="assunto" required>
            <option value="" disabled selected>Selecione um assunto</option>
            <option value="orcamento">Solicitar Orçamento</option>
            <option value="suporte">Suporte Técnico</option>
            <option value="duvidas">Dúvidas Gerais</option>
            <option value="parceria">Parcerias</option>
          </select>
        </div>
        <div class="campo-grupo">
          <label for="mensagem">Mensagem:</label>
          <textarea id="mensagem" name="mensagem" rows="6" placeholder="Escreva sua mensagem aqui..."
            required></textarea>
        </div>
        <button type="submit" class="btn-enviar">Enviar Mensagem</button>
      </form>
    </section>
  </main>
  <footer>
    <div class="footer-conteudo">
      <p>&copy; 2026 X | S Soluções Tech. Todos os direitos reservados.</p>
    </div>
  </footer>
</body>

</html>
